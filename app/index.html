<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="clock">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date"></div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main id="scroller" class="scroller">
    <div id="grid" class="grid"></div>
  </main>

  <footer class="hints">
    <span><b>OK</b> abrir</span>
    <span><b class="k-red">●</b> mover para o início</span>
    <span><b class="k-green">●</b> atualizar lista</span>
  </footer>

  <script src="apps.config.js"></script>
  <script src="app.js"></script>
</body>
</html>
